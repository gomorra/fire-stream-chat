name: Claude Code Review

# Fixed 2026-09-19. From 2026-07 to 2026-09 this workflow ran 34 times and posted
# nothing, while exiting `success` every time — a green check certifying nothing.
# Two missing arguments, both load-bearing per the action's own docs:
#
#   1. `--comment` in `prompt`. Without it Claude writes its findings to the
#      workflow run log and posts nothing to the PR.
#   2. `--allowedTools` in `claude_args`. The action starts the MCP server that
#      posts inline comments ONLY when --allowedTools names it; the skill's own
#      `allowed-tools` frontmatter is not enough. This is what the PR #57 run's
#      `permission_denials_count: 18` was.
#
# The read-only `permissions` block below is NOT the fault and matches the
# documented example: the action authenticates as the Claude GitHub App through
# OIDC (`id-token: write`), whose write access is separate from GITHUB_TOKEN.
#
# Keep both arguments. If an edit drops either, this goes back to burning
# $0.15–$1.28 per PR for silence — the tell is "No buffered inline comments" in
# the run log under a green check. Verify a run actually posts before trusting
# this check again. Background: docs/GOTCHAS.md, "Build tooling".

on:
  pull_request:
    # `synchronize` included so a fix pushed after opening is reviewed too. The
    # action skips drafts, closed PRs, PRs it judges trivial, and PRs that
    # already carry a Claude comment, which bounds the per-push cost.
    types: [opened, reopened, ready_for_review, synchronize]
    # Skip PRs that only touch docs or test sources (incl. flavor variants).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'app/src/test*/**'
      - 'app/src/androidTest*/**'

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `medium` effort keeps findings high-confidence and cheaper than the
          # default; Sonnet costs far fewer tokens per run than an uncapped Opus.
          prompt: '/code-review:code-review --comment medium ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The allowedTools line is what starts the inline-comment MCP server
          # — see the header. Do not drop it.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

