name: Claude Code Review

on:
  pull_request:
    # Review once per PR — NOT on every pushed commit (no `synchronize`),
    # which is what made this workflow burn tokens.
    types: [opened, reopened, ready_for_review]
    # Skip PRs that only touch docs or test sources (incl. flavor variants).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'app/src/test*/**'
      - 'app/src/androidTest*/**'

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `medium` effort keeps findings high-confidence and cheaper than the
          # default; Sonnet costs far fewer tokens per run than an uncapped Opus.
          prompt: '/code-review:code-review medium ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-sonnet-5'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

